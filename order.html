<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmation - RentEase Pro</title>

<link rel="stylesheet" href="order.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="navbar">

    <h2>RentEase Pro</h2>

   <a href="index.html">
            <i class="fa-solid fa-house"></i>
        </a>

</header>

<div class="order-container">

    <i class="fa-solid fa-circle-check success-icon"></i>

    <h1>Order Placed Successfully!</h1>

    <p>Thank you for shopping with RentEase Pro.</p>

    <div class="order-details">

        <h3>Order Information</h3>

        <p><strong>Order ID:</strong> <span id="order-id"></span></p>

        <p><strong>Date:</strong> <span id="order-date"></span></p>

        <p><strong>Estimated Delivery:</strong> 2 - 4 Business Days</p>

    </div>

    <h2>Your Order</h2>

    <div id="order-items">

        <!-- Products will appear here -->

    </div>

    <h2>Total Amount : ₹<span id="total-price">0</span></h2>

    <a href="index.html">

        <button class="continue-btn">

            Continue Shopping

        </button>

        <a href="invoice.html">
            <button class="invoice-btn">Download Invoice</button>
        </a>
        

</div>

<script src="order.js"></script>

</body>
</html>
