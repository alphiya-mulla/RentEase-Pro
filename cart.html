<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - RentEase Pro</title>

    <link rel="stylesheet" href="cart.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>

    <h1>RentEase Pro</h1>

    <div class="nav-icons">

        <a href="index.html">
            <i class="fa-solid fa-house"></i>
        </a>

        <a href="wishlist.html" id="wishlistIcon">
            <i class="fa-solid fa-heart"></i>
        </a>

       
    </div>

</header>

<h2 class="title">🛒 My Cart</h2>

<div class="cart-container">

    <table>

        <thead>

            <tr>
                
                
                <th>Product</th>
                <th>Price/month </th>
                <th>Duration</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="cart-items">

            <!-- Products will be loaded here using cart.js -->

        </tbody>

    </table>

    <div class="cart-summary">

        <h2>
            Grand Total :
            <span id="grand-total">₹0</span>
        </h2>

    </div>

    <div class="cart-buttons">

        <a href="products.html">
            <button class="continue-btn">
                Continue Shopping
            </button>
        </a>

        <button id="place-order" class="order-btn">
            Place Order
        </button>

    </div>

</div>

<script src="common.js"></script>
<script src="cart.js"></script>

</body>
</html>
